name: Deploy site to GitHub Pages

# reports/*.json を「正」として DB を作り直し、スマホ向けPWAサイトを
# 生成して GitHub Pages に自動デプロイする。
#
# ■ 初回のみの手動設定（1回だけ）:
#   リポジトリ Settings → Pages → Build and deployment → Source を
#   「GitHub Actions」に変更する。
#
# ■ デプロイの契機:
#   デフォルトブランチ(main)に、データ(reports/)や生成コードの変更が
#   push されたとき。Actionsタブから手動実行(Run workflow)も可能。

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
      - "web/**"
      - "machine_report.py"
      - "build_site.py"
      - "build_db.py"
      - "init_db.py"
      - "fetch_public_info.py"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: サイトを生成（reports/*.json からDB再構築 → PWAサイト）
        run: python build_site.py --rebuild-db
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
